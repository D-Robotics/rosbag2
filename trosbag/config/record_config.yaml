# rosbag2 record_config 示例配置 (CLI `--record-config` 与 component launch 通用)
# ============================================================================
# 用法 1 - CLI:
#   ros2 bag record -o /tmp/my_bag --record-config \
#       $(ros2 pkg prefix trosbag)/share/trosbag/config/record_config.yaml
#
# 用法 2 - composable (component) launch:
#   ros2 launch trosbag composable_recorder.launch.py \
#       bag_uri:=/tmp/bags \
#       record_config:=$(ros2 pkg prefix trosbag)/share/trosbag/config/record_config.yaml
#   (launch 会从 `topics:` 段派生 topic 列表并把 per-topic QoS 写到 sidecar
#    扁平 yaml, 通过 Recorder 的 qos_profile_overrides_path 参数加载;
#    topics 也会和 topics:= 参数合并, 与 CLI 行为一致)
#
# 说明:
#  - 顶层必须是 YAML mapping; 解析器只读取 'topics' 段, 其余顶层字段被忽略
#    (output / compression 等请走命令行参数 -o / --compression-mode,
#     或 launch 的 bag_uri / storage_id 参数)
#  - CLI 模式下不能与 --all 一起用 (ros2bag/verb/record.py 会报错);
#    component launch 模式下设置 record_config 会自动 all:=false
#  - 对重叠 topic, 此处 QoS 优先级高于 --qos-profile-overrides
#  - qos_profile 字段格式与 --qos-profile-overrides 完全一致
#    (reliability/durability/history/depth/deadline/lifespan/liveliness)
# ============================================================================

topics:
  # 普通话题, 可靠传输, 保留最近 10 条
  /chatter:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 10

  # 图像/传感器话题, best_effort 适配 UDP/共享内存发布者
  /image_raw:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 1

  # 高频 IMU, 保留全部历史 (谨慎, 长时间录制易爆内存)
  /imu/data:
    reliability: best_effort
    durability: volatile
    history: keep_all

  # 控制话题, 带 deadline (100ms) + lifespan (1s) 约束
  /cmd_vel:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 5
    deadline:
      sec: 0
      nsec: 100000000  # 100ms
    lifespan:
      sec: 1
      nsec: 0
    liveliness: automatic
