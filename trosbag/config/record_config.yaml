# rosbag2 --record-config 示例配置
# ============================================================================
# 用法 (CLI):
#   ros2 bag record -o /tmp/my_bag --record-config \
#       $(ros2 pkg prefix trosbag)/share/trosbag/config/record_config.yaml
#
# 也可以直接用源码里的文件:
#   ros2 bag record -o /tmp/my_bag --record-config trosbag/config/record_config.yaml
#
# 说明:
#  - 顶层必须是 YAML mapping; 解析器只读取 'topics' 段, 其余顶层字段被忽略
#    (output / compression 等请走命令行参数 -o / --compression-mode)
#  - 不能与 --all 一起使用 (ros2bag/verb/record.py 会报错)
#  - 对重叠 topic, 此处 QoS 优先级高于 --qos-profile-overrides
#  - qos_profile 字段格式与 --qos-profile-overrides 完全一致
#    (reliability/durability/history/depth/deadline/lifespan/liveliness)
#
# 注意: 这是 CLI `--record-config` 专用格式 (带 'topics:' 包裹).
#       composable (component) 模式不经过 CLI, 不使用此文件;
#       component 模式如需 per-topic QoS, 用 'qos_profile_overrides_path' 参数
#       指向一个 *扁平* mapping (无 'topics:' 包裹) 的 yaml 文件.
# ============================================================================

topics:
  # 普通话题, 可靠传输, 保留最近 10 条
  /chatter:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 10

  # 图像/传感器话题, best_effort 适配 UDP/共享内存发布者
  /image_raw:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 1

  # 高频 IMU, 保留全部历史 (谨慎, 长时间录制易爆内存)
  /imu/data:
    reliability: best_effort
    durability: volatile
    history: keep_all

  # 控制话题, 带 deadline (100ms) + lifespan (1s) 约束
  /cmd_vel:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 5
    deadline:
      sec: 0
      nsec: 100000000  # 100ms
    lifespan:
      sec: 1
      nsec: 0
    liveliness: automatic
